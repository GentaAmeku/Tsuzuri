name: CI

on:
  push:
    branches: [main]
  pull_request:

# リポジトリの中身を読むだけにする
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      # 使う Action はコミットの ID で固定する(タグを後から付け替えられても影響を受けない)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test
      # セットアップの doctor: 文法と、JSON の形を確かめる(CI ではアプリが入っていないので、終了コードは見ない)
      - run: zsh -n scripts/doctor.sh
      - run: |
          scripts/doctor.sh --json > doctor.json || true
          python3 -m json.tool doctor.json > /dev/null
          scripts/doctor.sh --checklist --lang en || true
