* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; }
.canvas { position: relative; width: 980px; padding: 28px 36px; background: linear-gradient(160deg, #8fa3c4 0%, #a9b6cf 50%, #b9adc9 100%); display: grid; grid-template-columns: 170px 1fr; row-gap: 26px; align-items: end; }

.slot { display: flex; justify-content: center; }
.hud { border-radius: 22px; overflow: hidden; }
.bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 8px; }
.stop { width: 28px; height: 28px; border-radius: 50%; background: #ff3b30; display: grid; place-items: center; flex: none; }

.dots { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2.5px; height: 20px; }
.dots i { width: 2px; border-radius: 1px; }
.mic { width: 18px; display: grid; place-items: center; flex: none; }
.time { font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.engine { font-size: 11px; flex: none; }
.text { padding: 12px 16px 2px; font-size: 14px; line-height: 1.5; }
.text .tent { opacity: .55; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; border: 1px solid; flex: none; }
.oneline { flex: 1; min-width: 0; display: flex; justify-content: flex-end; overflow: hidden; font-size: 13.5px; white-space: nowrap; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 28px); }
.oneline > span { flex: none; }
.tag { position: absolute; right: 14px; top: 10px; font-size: 12px; color: #fff; background: rgba(0,0,0,0.45); padding: 3px 9px; border-radius: 6px; }
